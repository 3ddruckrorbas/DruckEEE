        }

        .font-display {

        }

        }

        }

            background: #cbd5e1;

        }

            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .anim-fadeInUp {
            animation: fadeInUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .anim-fadeIn {
            animation: fadeIn 0.3s ease-out forwards;
        }

        .anim-scaleIn {
            animation: scaleIn 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .anim-delay-1 {
            animation-delay: 0.1s;
            opacity: 0;
        }

        .anim-delay-2 {
            animation-delay: 0.2s;
            opacity: 0;
        }

        .anim-delay-3 {
            animation-delay: 0.3s;
            opacity: 0;
        }

        .anim-delay-4 {
            animation-delay: 0.4s;
            opacity: 0;
        }

        .category-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .category-card:hover {
            transform: translateY(-3px);

        }

        .category-card:active {
            transform: scale(0.97);

            background: transparent;

            color: white;
            outline: none;

            border-radius: 8px;
            padding: 10px 12px;
            color: white;
            outline: none;

            var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });

        const getDeviceId = () => {
            try {
                let id = localStorage.getItem('rorbas_device_id');
                if (!id) { id = generateUUID(); localStorage.setItem('rorbas_device_id', id); }
                return id;
            } catch (e) { return generateUUID(); }
        };

        const API_URL = '/api';
        const ApiService = {
            getOrders: async (deviceId) => {
                const query = deviceId ? `?deviceId=${deviceId}` : '';
                const res = await fetch(`${API_URL}/orders${query}`, { headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' } });
                return await res.json();
            },
            addOrder: async (data, deviceId) => {
                const res = await fetch(`${API_URL}/orders`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...data, deviceId }) });
                return await res.json();
            },
            sendQuestion: async (message) => {
                const res = await fetch(`${API_URL}/questions`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message }) });
                return await res.json();
            },
            updateOrder: async (id, updates) => {
                const res = await fetch(`${API_URL}/orders/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updates) });
                return await res.json();
            },
            deleteOrder: async (id) => { const res = await fetch(`${API_URL}/orders/${id}`, { method: 'DELETE' }); return await res.json(); },
            getBanned: async () => { try { const res = await fetch(`${API_URL}/banned`); return await res.json(); } catch (e) { return []; } },

                    const base64Images = await Promise.all(base64Promises);

                setIsAdding(false);

        // --- FILAMENT MANAGER (Admin) ---
        const FilamentManager = ({ filaments, onChange }) => {
            const [isAdding, setIsAdding] = React.useState(false);
            const [editingId, setEditingId] = React.useState(null);
            const [newFilament, setNewFilament] = React.useState({ name: '', color: '', colorHex: '#000000', material: 'PLA', pricePer100g: '', fixedPriceUnder50g: '' });

            const handleAdd = async (e) => {
                e.preventDefault();
                const res = await ApiService.addFilament(newFilament);

                setIsAdding(false);
                setNewFilament({ name: '', color: '', colorHex: '#000000', material: 'PLA', pricePer100g: '', fixedPriceUnder50g: '' });
            };
            const startEdit = (fil) => { setEditingId(fil.id); setEditForm({ ...fil }); };
            const handleUpdate = async (e) => { e.preventDefault(); const res = await ApiService.updateFilament(editingId, editForm); onChange(res); setEditingId(null); };
            const toggleStock = async (fil) => { const res = await ApiService.updateFilament(fil.id, { inStock: !fil.inStock }); onChange(res); };
            const handleDelete = async (id) => { if (confirm("Filament wirklich löschen?")) { const res = await ApiService.deleteFilament(id); onChange(res); } };

            return (
                <div className="space-y-6">

                        </Button>
                    </div>

                    {isAdding && (
                        <form onSubmit={handleAdd} className="admin-card p-6 grid grid-cols-1 md:grid-cols-2 gap-4 anim-fadeIn">
                            <div><label className="block text-xs text-slate-400 uppercase tracking-wider mb-1">Bezeichnung</label><input required className="admin-input" value={newFilament.name} onChange={e => setNewFilament({ ...newFilament, name: e.target.value })} placeholder="z.B. PLA Matt Schwarz" /></div>
                            <div><label className="block text-xs text-slate-400 uppercase tracking-wider mb-1">Material</label>

                            <div><label className="block text-xs text-slate-400 uppercase tracking-wider mb-1">Farbbezeichnung</label><input required className="admin-input" value={newFilament.color} onChange={e => setNewFilament({ ...newFilament, color: e.target.value })} placeholder="z.B. Midnight Black" /></div>

                                </div>
                            </div>
                            <div><label className="block text-xs text-slate-400 uppercase tracking-wider mb-1">Preis pro 100g (CHF)</label><input type="number" step="0.01" className="admin-input" value={newFilament.pricePer100g} onChange={e => setNewFilament({ ...newFilament, pricePer100g: e.target.value })} placeholder="5.50" /></div>
                            <div><label className="block text-xs text-slate-400 uppercase tracking-wider mb-1">Fixpreis &lt; 50g (CHF)</label><input type="number" step="0.01" className="admin-input" value={newFilament.fixedPriceUnder50g} onChange={e => setNewFilament({ ...newFilament, fixedPriceUnder50g: e.target.value })} placeholder="3.00" /></div>

        // --- BAN MANAGER (Admin) ---
        const BanManager = () => {
            const [bannedIds, setBannedIds] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [newId, setNewId] = React.useState('');

            React.useEffect(() => { ApiService.getBanned().then(data => { setBannedIds(data); setLoading(false); }); }, []);
            const handleBan = async (e) => { e.preventDefault(); if (!newId.trim()) return; const res = await ApiService.banDevice(newId.trim()); setBannedIds(res); setNewId(''); };
            const handleUnban = async (id) => { const res = await ApiService.unbanDevice(id); setBannedIds(res); };

            return (
                <div className="space-y-6">
                    <h3 className="font-display font-bold text-white text-lg">Gerätesperrung</h3>
                    <form onSubmit={handleBan} className="flex gap-3">

                        <Button type="submit" size="sm" variant="danger">Sperren</Button>

                    {loading ? <div className="animate-spin rounded-full h-6 w-6 border-b-2 border-amber-400 mx-auto" /> :

                            <div className="space-y-2">
                                {bannedIds.map(id => (
                                    <div key={id} className="admin-card p-3 flex items-center justify-between">
                                        <span className="text-slate-300 font-mono text-sm">{id}</span>
                                        <Button onClick={() => handleUnban(id)} size="xs" variant="ghost">Entsperren</Button>
                                    </div>
                                ))}
                            </div>
                    }
                </div>
            );
        };

        // --- PASSWORD MANAGER (Admin) ---
        const PasswordManager = () => {
            const [passwords, setPasswords] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [newPw, setNewPw] = React.useState('');
            const [showNew, setShowNew] = React.useState(false);
            const [error, setError] = React.useState('');

            React.useEffect(() => { ApiService.getPasswords().then(data => { setPasswords(data); setLoading(false); }); }, []);
            const handleAdd = async (e) => {
                e.preventDefault();
                if (!newPw.trim()) return;
                try { const res = await ApiService.addPassword(newPw); setPasswords(res); setNewPw(''); setError(''); }
                catch (err) { setError(err.message); }
            };
            const handleDelete = async (pw) => {
                try { const res = await ApiService.deletePassword(pw); setPasswords(res); setError(''); }
                catch (err) { setError(err.message); }
            };

            return (
                <div className="space-y-6">
                    <h3 className="font-display font-bold text-white text-lg">Passwort-Verwaltung</h3>
                    <form onSubmit={handleAdd} className="flex gap-3">
                        <div className="relative flex-1">
                            <input type={showNew ? "text" : "password"} className="admin-input border border-white/10 rounded-xl px-4 py-2 pr-10 w-full" value={newPw} onChange={e => setNewPw(e.target.value)} placeholder="Neues Passwort" />
                            <button type="button" onClick={() => setShowNew(!showNew)} className="absolute right-3 top-2.5 text-slate-400"><Eye className="h-4 w-4" /></button>
                        </div>
                        <Button type="submit" size="sm">Hinzufügen</Button>
                    </form>
                    {error && <p className="text-red-400 text-sm">{error}</p>}
                    {loading ? <div className="animate-spin rounded-full h-6 w-6 border-b-2 border-amber-400 mx-auto" /> :
                        <div className="space-y-2">
                            {passwords.map((pw, idx) => (
                                <div key={idx} className="admin-card p-3 flex items-center justify-between">
                                    <span className="text-slate-300 font-mono text-sm">{'•'.repeat(pw.length)}</span>
                                    <Button onClick={() => handleDelete(pw)} size="xs" variant="danger">Löschen</Button>
                                </div>
                            ))}
                        </div>
                    }
                </div>
            );
        };

        // --- ADMIN DASHBOARD ---
        const AdminDashboard = ({ currentUser, onLogout }) => {
            const [activeTab, setActiveTab] = React.useState('orders');
            const [orders, setOrders] = React.useState([]);
            const [filaments, setFilaments] = React.useState([]);
            const [templates, setTemplates] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [editingId, setEditingId] = React.useState(null);
            const [editForm, setEditForm] = React.useState({});

            const loadData = async () => {
                setLoading(true);
                const [o, f, t] = await Promise.all([ApiService.getOrders(), ApiService.getFilaments(), ApiService.getTemplates()]);
                setOrders(o); setFilaments(f); setTemplates(t);
                setLoading(false);
            };

            React.useEffect(() => { loadData(); }, []);

            const startEditOrder = (order) => { setEditingId(order.id); setEditForm({ status: order.status, adminNotes: order.adminNotes || '' }); };
            const saveEditOrder = async (id) => { const res = await ApiService.updateOrder(id, editForm); setOrders(res); setEditingId(null); };
            const handleDeleteOrder = async (id) => { if (confirm("Bestellung wirklich löschen?")) { const res = await ApiService.deleteOrder(id); setOrders(res); } };

            const tabs = [
                { id: 'orders', label: 'Bestellungen', icon: <ClipboardList className="h-4 w-4" /> },
                { id: 'filaments', label: 'Materialien', icon: <Database className="h-4 w-4" /> },
                { id: 'templates', label: 'Vorlagen', icon: <Layout className="h-4 w-4" /> },
                { id: 'ban', label: 'Sperren', icon: <ShieldBan className="h-4 w-4" /> },
                { id: 'settings', label: 'Einstellungen', icon: <Settings className="h-4 w-4" /> },
            ];

            const Layout = (props) => <Icon {...props}><rect x="3" y="3" width="18" height="18" rx="2" ry="2" /><line x1="3" y1="9" x2="21" y2="9" /><line x1="9" y1="21" x2="9" y2="9" /></Icon>;

            return (
                <div className="admin-panel min-h-screen">
                    <div className="sticky top-0 z-40 bg-ebony/95 backdrop-blur border-b border-white/5 px-4 py-3 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="w-9 h-9 rounded-xl bg-amber-500/20 flex items-center justify-center">
                                <ServerIcon className="h-5 w-5 text-amber-400" />
                            </div>
                            <span className="font-display font-bold text-white">Admin Dashboard</span>
                        </div>
                        <Button onClick={onLogout} variant="ghost" size="sm" className="text-slate-400 hover:text-white">Logout</Button>
                    </div>

                    <div className="max-w-6xl mx-auto px-4 py-6">
                        <div className="flex gap-2 overflow-x-auto no-scrollbar mb-6 pb-2">
                            {tabs.map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                                    className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all ${activeTab === tab.id ? 'bg-amber-500 text-slate-900' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}>
                                    {tab.icon} {tab.label}
                                </button>
                            ))}
                        </div>

                        <div className="admin-card p-6">
                            {loading && activeTab !== 'settings' ? (
                                <div className="flex justify-center py-16"><div className="animate-spin rounded-full h-10 w-10 border-b-2 border-amber-400" /></div>
                            ) : activeTab === 'filaments' ? <FilamentManager filaments={filaments} onChange={setFilaments} />
                                : activeTab === 'templates' ? <TemplateManager templates={templates} onChange={setTemplates} />
                                    : activeTab === 'ban' ? <BanManager />
                                        : activeTab === 'settings' ? <PasswordManager />
                                            : (
                                                <div className="space-y-4">
                                                    <div className="flex items-center justify-between">
                                                        <h2 className="font-display font-bold text-white text-xl">Bestellungen ({orders.length})</h2>
                                                        <Button onClick={loadData} variant="secondary" size="sm" className="gap-2">
                                                            <RefreshCw className={`h-4 w-4 ${loading ? 'animate-spin' : ''}`} /> Aktualisieren
                                                        </Button>
                                                    </div>
                                                    {orders.length === 0 ? (
                                                        <div className="text-center text-slate-500 py-16 border border-dashed border-white/10 rounded-2xl">Keine Bestellungen vorhanden.</div>
                                                    ) : orders.map(order => (
                                                        <div key={order.id} className="admin-card p-5 hover:border-amber-500/30 transition-all">
                                                            {editingId === order.id ? (
                                                                <div className="space-y-4 anim-fadeIn">
                                                                    <div className="flex justify-between items-center pb-3 border-b border-white/10">
                                                                        <h3 className="font-bold text-white">Bestellung bearbeiten</h3>
                                                                        <Button onClick={() => setEditingId(null)} variant="ghost" size="sm"><X className="h-4 w-4" /></Button>
                                                                    </div>
                                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                                        <div><label className="block text-xs text-slate-400 mb-1">Status</label>
                                                                            <select value={editForm.status} onChange={e => setEditForm({ ...editForm, status: e.target.value })} className="admin-select">
                                                                                {Object.entries(ORDER_STATUS).map(([key, val]) => (<option key={val.id} value={val.id}>{val.label}</option>))}
                                                                            </select>
                                                                        </div>
                                                                        <div><label className="block text-xs text-slate-400 mb-1">Admin Notiz</label>
                                                                            <textarea value={editForm.adminNotes} onChange={e => setEditForm({ ...editForm, adminNotes: e.target.value })} className="admin-select w-full resize-none" rows="3" />
                                                                        </div>
                                                                    </div>
                                                                    <div className="flex justify-end gap-2">
                                                                        <Button onClick={() => setEditingId(null)} variant="ghost" size="sm">Abbrechen</Button>
                                                                        <Button onClick={() => saveEditOrder(order.id)} size="sm">Speichern</Button>
                                                                    </div>
                                                                </div>
                                                            ) : (
                                                                <div className="flex flex-col md:flex-row justify-between gap-4">
                                                                    <div className="flex-1 space-y-3">
                                                                        <div className="flex items-center gap-2 flex-wrap">
                                                                            <span className={`px-3 py-1 rounded-full text-xs font-bold ${ORDER_STATUS[order.status?.toUpperCase()]?.color || 'bg-slate-700 text-white'}`}>
                                                                                {ORDER_STATUS[order.status?.toUpperCase()]?.label || order.status}

                                                                            <div><p className="text-xs text-slate-500 mb-0.5">Email</p><p className="text-white text-sm truncate">{order.userEmail}</p></div>

                                                                            <div><p className="text-xs text-slate-500 mb-0.5">Vorlage</p><p className="text-white text-sm">{order.description?.slice(0, 30)}</p></div>
                                                                        </div>
                                                                        {order.adminNotes && (
                                                                            <div className="bg-amber-900/20 border-l-2 border-amber-500 pl-3 py-2 rounded-r-lg">
                                                                                <p className="text-xs text-amber-400 mb-0.5 font-bold">Admin Notiz</p>
                                                                                <p className="text-amber-200 text-xs italic">{order.adminNotes}</p>
                                                                            </div>

                                                                        <Button onClick={() => startEditOrder(order)} variant="secondary" size="xs" className="gap-1"><Edit className="h-3 w-3" /> Bearbeiten</Button>
                                                                        <Button onClick={() => { if (confirm("Gerät wirklich sperren?")) ApiService.banDevice(order.deviceId).then(() => alert("Gesperrt.")); }} variant="ghost" size="xs" className="text-slate-500 hover:text-red-400"><ShieldBan className="h-3 w-3" /> Sperren</Button>
                                                                        <Button onClick={() => handleDeleteOrder(order.id)} variant="danger" size="xs" className="gap-1"><Trash2 className="h-3 w-3" /> Löschen</Button>
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- ORDER FORM ---
        const OrderForm = ({ onCancel, onSubmitSuccess, deviceId, stockFilaments, templates, onNavigate, flow = 'idea' }) => {
            const [step, setStep] = React.useState(1);
            const [formData, setFormData] = React.useState({
                projectType: ['templates', 'qrcode', 'describe'].includes(flow) ? flow : (flow === 'shop' ? 'templates' : 'describe'),
                projectDescription: '', selectedTemplateId: null,
                qrType: 'website', qrUrl: '', qrWifiSsid: '', qrWifiPassword: '', qrWifiEncryption: 'WPA2',
                qrSize: '10x10', qrNfc: false, qrForegroundColorId: null, qrBackgroundColorId: null,
                filamentMode: 'stock', selectedFilamentId: null, customFilamentRequest: '',
                userName: '', userEmail: '', userPhone: '', street: '', zip: '', city: ''
            });
            const [showNfcInfo, setShowNfcInfo] = React.useState(false);
            const [selectedMaterialCategory, setSelectedMaterialCategory] = React.useState('PLA');
            const [isSubmitting, setIsSubmitting] = React.useState(false);
            const [showMaterialInfo, setShowMaterialInfo] = React.useState(false);
            const [agbAccepted, setAgbAccepted] = React.useState(false);
            const [previewImages, setPreviewImages] = React.useState(null);
            const [currentPreviewIdx, setCurrentPreviewIdx] = React.useState(0);
            const [activePriceId, setActivePriceId] = React.useState(null);
            const [templateSearch, setTemplateSearch] = React.useState('');
            const [selectedTemplateDetails, setSelectedTemplateDetails] = React.useState(null);
            const formRef = React.useRef(null);
            const materialInfoRef = React.useRef(null);

            React.useEffect(() => {
                if (showMaterialInfo && materialInfoRef.current) {
                    setTimeout(() => { materialInfoRef.current.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
                }
            }, [showMaterialInfo]);

            const handleStepChange = (newStep) => {
                setStep(newStep);
                if (formRef.current) formRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
                else window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const calculatePrice = (filament, weight) => {
                if (!filament || !weight) return null;
                const w = parseFloat(weight);
                if (isNaN(w)) return null;
                let price = 0;
                if (w < 50 && filament.fixedPriceUnder50g) price = parseFloat(filament.fixedPriceUnder50g);
                else if (filament.pricePer100g) price = (w / 100) * parseFloat(filament.pricePer100g);
                else return null;
                return Math.ceil(price * 2) / 2;
            };

            const getStartingPrice = (weight) => {
                if (!weight || !stockFilaments.length) return null;
                const prices = stockFilaments.map(f => calculatePrice(f, weight)).filter(p => p !== null);
                if (!prices.length) return null;
                return Math.min(...prices);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                const selectedStock = stockFilaments.find(f => f.id === formData.selectedFilamentId);
                let materialText = "";
                if (formData.projectType === 'templates') {
                    const selectedTemplate = templates.find(t => t.id === formData.selectedTemplateId);
                    if (selectedTemplate && selectedTemplate.skipColorSelection) materialText = "Farbauswahl übersprungen (Vorlage)";
                }
                if (!materialText) {
                    if (formData.projectType === 'qrcode') {
                        const fg = stockFilaments.find(f => f.id === formData.qrForegroundColorId);
                        const bg = stockFilaments.find(f => f.id === formData.qrBackgroundColorId);
                        materialText = `QR-Code Farben: Vordergrund: ${fg?.name || 'N/A'} (${fg?.material || ''}), Hintergrund: ${bg?.name || 'N/A'} (${bg?.material || ''})${formData.qrNfc ? ` + NFC Tag (+ ${NFC_SURCHARGE.toFixed(2)} CHF)` : ''}`;
                    } else if (formData.filamentMode === 'stock' && selectedStock) {
                        materialText = `Lager-Filament: ${selectedStock.name} (${selectedStock.material})`;
                    } else {
                        materialText = `Spezialwunsch: ${formData.customFilamentRequest}`;
                    }
                }
                let finalDescription = formData.projectDescription;
                if (formData.projectType === 'templates') {
                    const tpl = templates.find(t => t.id === formData.selectedTemplateId);
                    finalDescription = `VORLAGE: ${tpl?.title}\nBeschreibung: ${tpl?.description}\n\nZusatzinfos: ${formData.projectDescription}`;
                } else if (formData.projectType === 'qrcode') {
                    let qrContent = '';
                    if (formData.qrType === 'website') qrContent = `Typ: Webseite\nURL: ${formData.qrUrl}`;
                    else if (formData.qrType === 'google_review') qrContent = `Typ: Google Bewertung\nURL: ${formData.qrUrl}`;
                    else if (formData.qrType === 'wifi') qrContent = `Typ: WLAN\nSSID: ${formData.qrWifiSsid}\nPasswort: ${formData.qrWifiPassword}\nVerschlüsselung: ${formData.qrWifiEncryption}`;
                    else qrContent = `Typ: Sonstiges\nInhalt: ${formData.qrUrl}`;
                    finalDescription = `QR-CODE ANFRAGE\n${qrContent}\nGröße: ${formData.qrSize} cm\nNFC Funktion: ${formData.qrNfc ? `JA (+ ${NFC_SURCHARGE.toFixed(2)} CHF)` : 'NEIN'}\n\nZusatzinfos: ${formData.projectDescription}`;
                }
                try {
                    await ApiService.addOrder({ userName: formData.userName, userEmail: formData.userEmail, description: finalDescription, material: materialText, street: formData.street, zip: formData.zip, city: formData.city, userPhone: formData.userPhone }, deviceId);
                    setIsSubmitting(false);
                    onSubmitSuccess(false);
                } catch (error) {
                    alert("Es gab einen Fehler beim Speichern auf dem Server.");
                    setIsSubmitting(false);
                }
            };

            const filteredFilaments = stockFilaments.filter(f => f.material === selectedMaterialCategory);

            const isStep1Valid = () => {
                if (formData.projectType === 'describe') return formData.projectDescription.trim().length > 0;
                if (formData.projectType === 'templates') return formData.selectedTemplateId !== null;
                if (formData.projectType === 'qrcode') {
                    if (formData.qrType === 'wifi') return formData.qrWifiSsid.trim().length > 0;
                    return formData.qrUrl.trim().length > 0;
                }
                return true;
            };

            const isStep2Valid = () => {
                if (formData.projectType === 'templates') {
                    const tpl = templates.find(t => t.id === formData.selectedTemplateId);
                    if (tpl && tpl.skipColorSelection) return true;
                }
                if (formData.projectType === 'qrcode') {
                    if (formData.qrForegroundColorId && formData.qrBackgroundColorId) {
                        const fg = stockFilaments.find(f => f.id === formData.qrForegroundColorId);
                        const bg = stockFilaments.find(f => f.id === formData.qrBackgroundColorId);
                        return !(fg && bg && fg.material !== bg.material);
                    }
                    return false;
                }
                if (formData.filamentMode === 'stock') return formData.selectedFilamentId !== null;
                if (formData.filamentMode === 'custom') return formData.customFilamentRequest.trim().length > 0;
                return false;
            };

            const isStep3Valid = () => formData.userName && formData.userEmail && formData.street && formData.zip && formData.city && agbAccepted;

            const inputClass = "w-full border border-slate-200 rounded-2xl px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900 placeholder-slate-400 text-sm";
            const labelClass = "block text-sm font-semibold text-slate-700 mb-1.5";

            return (
                <div ref={formRef} className="w-full max-w-2xl mx-auto py-8 px-4 sm:px-6">
                    {/* Step indicator */}
                    <div className="flex items-center justify-center gap-2 mb-8">
                        {[1, 2, 3].map(s => (
                            <div key={s} className="flex items-center gap-2">
                                <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold transition-all ${step === s ? 'bg-slate-900 text-white' : step > s ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-400'}`}>
                                    {step > s ? <Check className="h-4 w-4" /> : s}
                                </div>
                                {s < 3 && <div className={`w-12 h-0.5 ${step > s ? 'bg-emerald-400' : 'bg-slate-200'}`} />}
                            </div>
                        ))}
                    </div>

                    <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                        <div className="p-6 md:p-8">
                            {/* STEP 1 */}
                            {step === 1 && (
                                <div className="space-y-6 anim-fadeIn">
                                    <div>
                                        <h2 className="font-display text-xl font-bold text-slate-900">Dein Projekt</h2>
                                        <p className="text-slate-500 text-sm mt-1">Was möchtest du drucken lassen?</p>
                                    </div>

                                    {/* Project Type Selection */}
                                    <div className="grid grid-cols-3 gap-3">
                                        {[
                                            { id: 'describe', label: 'Eigene Idee', icon: <Lightbulb className="h-5 w-5" /> },
                                            { id: 'templates', label: 'Vorlage', icon: <Store className="h-5 w-5" /> },
                                            { id: 'qrcode', label: 'QR-Code', icon: <QrCode className="h-5 w-5" /> },
                                        ].map(type => (
                                            <button key={type.id} type="button"
                                                onClick={() => setFormData({ ...formData, projectType: type.id })}
                                                className={`flex flex-col items-center gap-2 p-4 rounded-2xl border-2 text-sm font-semibold transition-all ${formData.projectType === type.id ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-200 text-slate-600 hover:border-slate-400'}`}>
                                                {type.icon} {type.label}
                                            </button>
                                        ))}
                                    </div>

                                    {formData.projectType === 'describe' && (
                                        <div>
                                            <label className={labelClass}>Beschreib dein Projekt</label>
                                            <textarea rows="5" className={inputClass + " resize-none"} placeholder="z.B. Ich möchte einen Halter für meinen Schreibtisch drucken lassen. Masse ca. 10x5x3cm..."
                                                value={formData.projectDescription} onChange={e => setFormData({ ...formData, projectDescription: e.target.value })} />
                                            <p className="text-xs text-slate-400 mt-2">Tipp: Beschreibe Grösse, Verwendungszweck und ob du eine .stl Datei hast.</p>
                                        </div>
                                    )}

                                    {formData.projectType === 'templates' && (
                                        <div className="space-y-4">
                                            <input type="search" className={inputClass} placeholder="Vorlage suchen..."
                                                value={templateSearch} onChange={e => setTemplateSearch(e.target.value)} />
                                            {templates.length === 0 ? (
                                                <div className="text-center py-8 text-slate-400">
                                                    <Box className="h-10 w-10 mx-auto mb-3 opacity-30" />
                                                    <p className="text-sm">Noch keine Vorlagen verfügbar.</p>
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-2 gap-3 max-h-80 overflow-y-auto custom-scrollbar">
                                                    {templates.filter(t => !templateSearch || t.title?.toLowerCase().includes(templateSearch.toLowerCase())).map(tpl => (
                                                        <button key={tpl.id} type="button"
                                                            onClick={() => { setFormData({ ...formData, selectedTemplateId: tpl.id }); setSelectedTemplateDetails(tpl); setPreviewImages(tpl.images); setCurrentPreviewIdx(0); }}
                                                            className={`rounded-2xl border-2 overflow-hidden text-left transition-all ${formData.selectedTemplateId === tpl.id ? 'border-slate-900 ring-2 ring-slate-900' : 'border-slate-100 hover:border-slate-300'}`}>
                                                            <div className="h-28 bg-slate-100 overflow-hidden">
                                                                <img src={tpl.images?.[0] || tpl.imageUrl} alt={tpl.title} className="w-full h-full object-cover" referrerPolicy="no-referrer" />
                                                            </div>
                                                            <div className="p-3">
                                                                <p className="font-bold text-slate-900 text-sm">{tpl.title}</p>
                                                                {tpl.weight && <p className="text-xs text-slate-400">{tpl.weight}g</p>}
                                                            </div>
                                                        </button>
                                                    ))}
                                                </div>
                                            )}
                                            {formData.selectedTemplateId && (
                                                <div>
                                                    <label className={labelClass}>Zusätzliche Anmerkungen</label>
                                                    <textarea rows="3" className={inputClass + " resize-none"} placeholder="Spezielle Wünsche oder Hinweise..."
                                                        value={formData.projectDescription} onChange={e => setFormData({ ...formData, projectDescription: e.target.value })} />
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {formData.projectType === 'qrcode' && (
                                        <div className="space-y-5">
                                            <div>
                                                <label className={labelClass}>QR-Code Typ</label>
                                                <div className="grid grid-cols-2 gap-2">
                                                    {[
                                                        { id: 'website', label: 'Webseite' }, { id: 'google_review', label: 'Google Bewertung' },
                                                        { id: 'wifi', label: 'WLAN' }, { id: 'other', label: 'Sonstiges' }
                                                    ].map(t => (
                                                        <button key={t.id} type="button" onClick={() => setFormData({ ...formData, qrType: t.id })}
                                                            className={`p-3 rounded-2xl border-2 text-sm font-semibold transition-all ${formData.qrType === t.id ? 'border-slate-900 bg-slate-50' : 'border-slate-200 hover:border-slate-400'}`}>
                                                            {t.label}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                            {formData.qrType === 'wifi' ? (
                                                <div className="space-y-4">
                                                    <div>
                                                        <label className={labelClass}>WLAN Name (SSID)</label>
                                                        <input type="text" className={inputClass} placeholder="Netzwerkname"
                                                            value={formData.qrWifiSsid} onChange={e => setFormData({ ...formData, qrWifiSsid: e.target.value })} />
                                                    </div>
                                                    <div>
                                                        <label className={labelClass}>WLAN Passwort</label>
                                                        <input type="text" className={inputClass} placeholder="Passwort"
                                                            value={formData.qrWifiPassword} onChange={e => setFormData({ ...formData, qrWifiPassword: e.target.value })} />
                                                    </div>
                                                    <div>
                                                        <label className={labelClass}>Verschlüsselung</label>
                                                        <select className={inputClass + " appearance-none"} value={formData.qrWifiEncryption} onChange={e => setFormData({ ...formData, qrWifiEncryption: e.target.value })}>
                                                            <option>WPA2</option><option>WPA3</option><option>WEP</option><option>None</option>
                                                        </select>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div>
                                                    <label className={labelClass}>{formData.qrType === 'website' ? 'Webseiten-URL' : formData.qrType === 'google_review' ? 'Google Bewertungs-Link' : 'Inhalt'}</label>
                                                    <input type={formData.qrType === 'other' ? 'text' : 'url'} className={inputClass}
                                                        placeholder={formData.qrType === 'website' ? 'https://...' : formData.qrType === 'google_review' ? 'https://g.page/r/...' : 'Dein Text oder Link'}
                                                        value={formData.qrUrl} onChange={e => setFormData({ ...formData, qrUrl: e.target.value })} />
                                                </div>
                                            )}
                                            <div>
                                                <label className={labelClass}>Grösse (max. 15x15 cm)</label>
                                                <div className="flex gap-2">
                                                    {['5x5', '10x10', '15x15'].map(size => (
                                                        <button key={size} type="button" onClick={() => setFormData({ ...formData, qrSize: size })}
                                                            className={`flex-1 py-2.5 rounded-2xl border-2 text-sm font-bold transition-all ${formData.qrSize === size ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-200 text-slate-600 hover:border-slate-400'}`}>
                                                            {size}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-200">
                                                <button type="button" className="flex items-center gap-3" onClick={() => setFormData({ ...formData, qrNfc: !formData.qrNfc })}>
                                                    <div className={`w-11 h-6 rounded-full relative flex-shrink-0 transition-colors ${formData.qrNfc ? 'bg-slate-900' : 'bg-slate-300'}`}>
                                                        <div className={`absolute top-1 w-4 h-4 bg-white rounded-full shadow transition-all ${formData.qrNfc ? 'left-6' : 'left-1'}`} />
                                                    </div>
                                                    <div>
                                                        <p className="text-sm font-bold text-slate-900">NFC Funktion <span className="text-amber-600 ml-1">(+ {NFC_SURCHARGE.toFixed(2)} CHF)</span></p>
                                                        <p className="text-xs text-slate-500">Chip einbetten</p>
                                                    </div>
                                                </button>
                                                <button type="button" onClick={() => setShowNfcInfo(true)} className="text-xs text-slate-400 hover:text-slate-700 flex items-center gap-1 font-semibold">
                                                    <HelpCircle className="h-3.5 w-3.5" /> Was ist das?
                                                </button>
                                            </div>
                                            <textarea rows="3" className={inputClass + " resize-none"} placeholder="Zusätzliche Anmerkungen..."
                                                value={formData.projectDescription} onChange={e => setFormData({ ...formData, projectDescription: e.target.value })} />
                                            {showNfcInfo && (
                                                <div className="fixed inset-0 z-[110] flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-sm" onClick={() => setShowNfcInfo(false)}>
                                                    <div className="max-w-sm w-full bg-white rounded-3xl p-7 shadow-2xl" onClick={e => e.stopPropagation()}>
                                                        <div className="flex justify-between items-center mb-5">
                                                            <h4 className="font-display font-bold text-slate-900 text-lg">NFC Technologie</h4>
                                                            <button onClick={() => setShowNfcInfo(false)} className="text-slate-400 hover:text-slate-700"><X className="h-5 w-5" /></button>
                                                        </div>
                                                        <div className="space-y-3 text-sm text-slate-600 leading-relaxed">
                                                            <p>Ein NFC (Near Field Communication) Tag ist ein winziger, batterieloser Chip, der in das 3D-Modell eingebettet wird.</p>
                                                            <p>Wenn jemand sein Smartphone in die Nähe des QR-Codes hält, kann das Handy automatisch eine Website öffnen – ganz ohne den Code scannen zu müssen.</p>
                                                        </div>
                                                        <Btn onClick={() => setShowNfcInfo(false)} className="w-full mt-5">Verstanden</Btn>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    <div className="flex justify-between pt-2">
                                        <Btn variant="ghost" onClick={onCancel} className="text-slate-500">Abbrechen</Btn>
                                        <Btn onClick={() => {
                                            if (formData.projectType === 'templates') {
                                                const tpl = templates.find(t => t.id === formData.selectedTemplateId);
                                                if (tpl && tpl.skipColorSelection) { handleStepChange(3); return; }
                                            }
                                            handleStepChange(2);
                                        }} disabled={!isStep1Valid()}>
                                            Weiter <ArrowRight className="h-4 w-4" />
                                        </Btn>
                                    </div>
                                </div>
                            )}

                            {/* STEP 2 */}
                            {step === 2 && (
                                <div className="space-y-6 anim-fadeIn">
                                    <div>
                                        <h2 className="font-display text-xl font-bold text-slate-900">Material & Farbe</h2>
                                        <p className="text-slate-500 text-sm mt-1">Wähle dein gewünschtes Filament</p>
                                    </div>

                                    {formData.projectType === 'qrcode' ? (
                                        <div className="space-y-6">
                                            <div className="p-4 bg-amber-50 rounded-2xl border border-amber-100 flex items-start gap-3">
                                                <Info className="h-5 w-5 text-amber-600 flex-shrink-0 mt-0.5" />
                                                <p className="text-sm text-amber-800">Wähle zwei Farben für deinen QR-Code. Wir empfehlen hohen Kontrast für beste Scanbarkeit.</p>
                                            </div>
                                            {['Vordergrund (Code-Farbe)', 'Hintergrund-Farbe'].map((label, idx) => {
                                                const isQrFg = idx === 0;
                                                const selectedId = isQrFg ? formData.qrForegroundColorId : formData.qrBackgroundColorId;
                                                return (
                                                    <div key={label} className="space-y-3">
                                                        <div className="flex items-center gap-2">
                                                            <div className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold text-white ${isQrFg ? 'bg-slate-900' : 'bg-amber-400 text-slate-900'}`}>{idx + 1}</div>
                                                            <label className="text-sm font-bold text-slate-700">{label}</label>
                                                        </div>
                                                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                                            {stockFilaments.map(f => (
                                                                <button key={`${isQrFg ? 'fg' : 'bg'}-${f.id}`} type="button" disabled={!f.inStock}
                                                                    onClick={() => setFormData({ ...formData, [isQrFg ? 'qrForegroundColorId' : 'qrBackgroundColorId']: f.id })}
                                                                    className={`p-3 rounded-xl border-2 text-left text-xs font-semibold transition-all flex items-center gap-2 ${selectedId === f.id ? 'border-slate-900 bg-slate-50' : 'border-slate-100 hover:border-slate-300'} ${!f.inStock ? 'opacity-30 cursor-not-allowed' : ''}`}>
                                                                    <div className="w-4 h-4 rounded-full flex-shrink-0" style={{ backgroundColor: f.colorHex }} />
                                                                    <span className="truncate">{f.name}</span>
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                            {formData.qrForegroundColorId && formData.qrBackgroundColorId && (() => {
                                                const fg = stockFilaments.find(f => f.id === formData.qrForegroundColorId);
                                                const bg = stockFilaments.find(f => f.id === formData.qrBackgroundColorId);
                                                if (fg && bg && fg.material !== bg.material) return (
                                                    <div className="p-4 bg-red-50 rounded-2xl border border-red-200 flex gap-3">
                                                        <AlertCircle className="h-5 w-5 text-red-500 flex-shrink-0" />
                                                        <div>
                                                            <p className="font-bold text-red-700 text-sm mb-1">Unterschiedliche Materialien</p>
                                                            <p className="text-xs text-red-600">Vordergrund ({fg.material}) und Hintergrund ({bg.material}) müssen aus dem gleichen Material sein.</p>
                                                        </div>
                                                    </div>
                                                );
                                            })()}
                                        </div>
                                    ) : (
                                        <div className="space-y-5">
                                            <div className="flex gap-2">
                                                {[
                                                    { id: 'stock', label: 'Unser Lager' },
                                                    { id: 'custom', label: 'Spezialwunsch' }
                                                ].map(m => (
                                                    <button key={m.id} type="button" onClick={() => setFormData({ ...formData, filamentMode: m.id })}
                                                        className={`flex-1 py-2.5 rounded-2xl border-2 text-sm font-bold transition-all ${formData.filamentMode === m.id ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-200 text-slate-600 hover:border-slate-400'}`}>
                                                        {m.label}
                                                    </button>
                                                ))}
                                            </div>

                                            {formData.filamentMode === 'stock' && (
                                                <div className="space-y-4">
                                                    <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                                                        {[...new Set(stockFilaments.filter(f => f.inStock).map(f => f.material))].map(mat => (
                                                            <button key={mat} type="button" onClick={() => setSelectedMaterialCategory(mat)}
                                                                className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${selectedMaterialCategory === mat ? 'bg-amber-400 text-slate-900' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                                                                {mat}
                                                            </button>
                                                        ))}
                                                    </div>
                                                    <div className="grid grid-cols-2 gap-2">
                                                        {filteredFilaments.map(f => {
                                                            const price = f.fixedPriceUnder50g ? `Ab ${f.fixedPriceUnder50g} CHF` : f.pricePer100g ? `${f.pricePer100g} CHF/100g` : '';
                                                            return (
                                                                <button key={f.id} type="button" disabled={!f.inStock}
                                                                    onClick={() => { setFormData({ ...formData, selectedFilamentId: f.id }); setActivePriceId(f.id); }}
                                                                    className={`p-3 rounded-2xl border-2 text-left transition-all ${formData.selectedFilamentId === f.id ? 'border-slate-900 bg-slate-50 ring-2 ring-slate-900' : 'border-slate-100 hover:border-slate-300'} ${!f.inStock ? 'opacity-30 cursor-not-allowed' : ''}`}>
                                                                    <div className="flex items-center gap-2 mb-2">
                                                                        <div className="w-5 h-5 rounded-full flex-shrink-0 border border-slate-200" style={{ backgroundColor: f.colorHex }} />
                                                                        <span className="text-xs font-bold text-slate-900 truncate">{f.name}</span>
                                                                    </div>
                                                                    {price && <p className="text-xs text-slate-400">{price}</p>}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            )}
                                            {formData.filamentMode === 'custom' && (
                                                <div>
                                                    <div className="p-4 bg-amber-50 rounded-2xl border border-amber-100 mb-4 flex items-start gap-3">
                                                        <Info className="h-5 w-5 text-amber-600 flex-shrink-0 mt-0.5" />
                                                        <p className="text-sm text-amber-800">Spezialfilamente: + {CUSTOM_FILAMENT_SURCHARGE.toFixed(2)} CHF Aufschlag. Wir benötigen ca. 2-3 Wochen Lieferzeit.</p>
                                                    </div>
                                                    <label className={labelClass}>Dein Filament-Wunsch</label>
                                                    <textarea rows="3" className={inputClass + " resize-none"}
                                                        placeholder="Beschreibe die gewünschte Farbe, Material oder einen Markennamen..."
                                                        value={formData.customFilamentRequest} onChange={e => setFormData({ ...formData, customFilamentRequest: e.target.value })} />
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    <div className="flex justify-between pt-2">
                                        <Btn variant="ghost" onClick={() => handleStepChange(1)} className="text-slate-500">
                                            <ArrowLeft className="h-4 w-4" /> Zurück

            if (view === ViewState.BANNED) return <BannedScreen />;

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col font-sans">
                    {view !== ViewState.ADMIN_DASHBOARD && view !== ViewState.ADMIN_LOGIN && view !== ViewState.BANNED && (
                        <Navbar currentView={view} onNavigate={handleNavigate} hasOrders={hasOrders} />
                    )}

                    <main className="flex-grow">
                        {view === ViewState.HOME && (
                            <>
                                <HomePage onStart={() => setShowStartModal(true)} onNavigate={handleNavigate} hasOrders={hasOrders} templates={templates} />
                                {showStartModal && <StartModal onClose={() => setShowStartModal(false)} onNavigate={handleNavigate} />}
                            </>
                        )}

                        {view === ViewState.ORDER && (
                            <div className="anim-fadeInUp pt-16 lg:pt-20">
                                <OrderForm key={orderFlow} flow={orderFlow}
                                    onCancel={() => handleNavigate(ViewState.HOME)}
                                    onSubmitSuccess={handleOrderSuccess}
                                    deviceId={deviceId}
                                    stockFilaments={filaments}
                                    templates={templates}
                                    onNavigate={handleNavigate} />
                            </div>
                        )}

                        {view === ViewState.SUCCESS && (
                            <div className="min-h-[70vh] flex items-center justify-center px-4 pt-20 anim-scaleIn">
                                <div className="text-center max-w-sm mx-auto">
                                    <div className="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                        <Sparkles className="h-10 w-10 text-emerald-600" />
                                    </div>
                                    <h2 className="font-display font-black text-3xl text-slate-900 mb-3">Anfrage übermittelt! 🎉</h2>
                                    <p className="text-slate-500 mb-8 leading-relaxed">Vielen Dank! Wir haben deine Anfrage erhalten und werden uns bald bei dir melden.</p>
                                    <div className="space-y-3">
                                        <Btn onClick={() => handleNavigate(ViewState.MY_ORDERS)} size="lg" className="w-full">Meine Bestellung ansehen</Btn>
                                        <Btn variant="ghost" onClick={() => handleNavigate(ViewState.HOME)} className="w-full text-slate-500">Zurück zur Startseite</Btn>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === ViewState.AGB && <div className="pt-14 lg:pt-16"><AGBView onBack={() => handleNavigate(ViewState.HOME)} /></div>}
                        {view === ViewState.ABOUT_US && <div className="pt-14 lg:pt-16"><AboutUsView onBack={() => handleNavigate(ViewState.HOME)} /></div>}
                        {view === ViewState.MY_ORDERS && <div className="pt-14 lg:pt-16"><MyOrdersView deviceId={deviceId} onBack={() => handleNavigate(ViewState.HOME)} onStartOrder={handleStartOrder} /></div>}
                        {view === ViewState.ADMIN_LOGIN && <div className="pt-14 lg:pt-16"><AdminLoginView onLogin={handleAdminLogin} onBack={() => handleNavigate(ViewState.HOME)} /></div>}
                        {view === ViewState.ADMIN_DASHBOARD && <AdminDashboard currentUser={currentUser} onLogout={handleLogout} />}
                    </main>

                    {view !== ViewState.ADMIN_DASHBOARD && view !== ViewState.ADMIN_LOGIN && view !== ViewState.BANNED && (
                        <Footer onNavigate={handleNavigate} />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
